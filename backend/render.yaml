services:
  - type: web
    name: rawaqa-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build && npm prune --omit=dev
    startCommand: node --max-old-space-size=400 dist/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://rawaqa-ruby.vercel.app
      - key: ENABLE_WORKERS
        value: true
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first


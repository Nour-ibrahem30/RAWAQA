services:
  - type: web
    name: rawaqa-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: node --max-old-space-size=400 dist/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── PostgreSQL (Prisma) — PRIMARY database, required. Set in dashboard. ──
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # ── Auth secrets — set in dashboard, never commit. ──
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # ── CORS / cookies / proxy ──
      - key: CORS_ORIGIN
        value: https://rawaqa.vercel.app
      - key: TRUST_PROXY
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      # ── DNS resilience (host platform's resolver returns EAI_AGAIN for Neon) ──
      # Enables the scoped public-DNS fallback for the DATABASE_URL host.
      - key: DNS_FALLBACK_ENABLED
        value: true
      - key: DNS_RESOLVER_STRATEGY
        value: fallback
      - key: DNS_FALLBACK_SERVERS
        value: 1.1.1.1,8.8.8.8
      # ── Workers ──
      - key: ENABLE_WORKERS
        value: true
      # ── Media (Cloudinary) — set in dashboard. ──
      - key: CLOUDINARY_ENABLED
        value: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Observability — set in dashboard. ──
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first

